name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      # Runs each package's `i18n:check` script (defined by packages/i18n).
      - name: i18n key check
        run: pnpm i18n:check

  # Smoke test for the phone app: catches what typecheck and unit tests miss but
  # would break the EAS Update published on every push to main (Metro/Babel
  # resolution, a missing or unhoisted module, native package versions that no
  # longer match the Expo SDK). It doesn't start the app; see docs/TESTING.md.
  mobile-bundle:
    name: Mobile bundle (iOS + Android)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/mobile
    env:
      EXPO_NO_TELEMETRY: 1
      # Public URL, not a secret (same as publish-update.yml).
      EXPO_PUBLIC_CONVEX_URL: https://tangible-ox-76.eu-west-1.convex.cloud
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Offline: compares against the installed SDK's own version table, so CI
      # doesn't turn red each time Expo publishes a newer patch. Those patches
      # are picked up with `pnpm expo install --fix` (docs/DEPENDENCIES.md).
      - name: Native packages match the Expo SDK
        run: pnpm exec expo install --check
        env:
          EXPO_OFFLINE: 1

      - name: Bundle for iOS and Android
        run: pnpm exec expo export --platform ios --platform android --output-dir "$RUNNER_TEMP/export"

  # Merges Dependabot's grouped dev-tooling and GitHub Actions PRs once the
  # checks above pass. Everything else, including security updates and
  # anything that ships to phones, waits for a person. See docs/DEPENDENCIES.md.
  dependabot-automerge:
    name: Dependabot auto-merge
    needs: [check, mobile-bundle]
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge
        if: >-
          (steps.meta.outputs.dependency-group == 'dev-tooling' ||
           steps.meta.outputs.dependency-group == 'github-actions') &&
          steps.meta.outputs.update-type != 'version-update:semver-major'
        # --match-head-commit: only merge the commit CI just checked.
        run: gh pr merge "$PR" --squash --match-head-commit "$SHA"
        env:
          PR: ${{ github.event.pull_request.html_url }}
          SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
