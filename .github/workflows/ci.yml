name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      # Runs each package's `i18n:check` script (defined by packages/i18n).
      - name: i18n key check
        run: pnpm i18n:check

  # Merges Dependabot's grouped dev-tooling and GitHub Actions PRs once the
  # check above passes. Everything else, including security updates and
  # anything that ships to phones, waits for a person. See docs/DEPENDENCIES.md.
  dependabot-automerge:
    name: Dependabot auto-merge
    needs: check
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge
        if: >-
          (steps.meta.outputs.dependency-group == 'dev-tooling' ||
           steps.meta.outputs.dependency-group == 'github-actions') &&
          steps.meta.outputs.update-type != 'version-update:semver-major'
        # --match-head-commit: only merge the commit CI just checked.
        run: gh pr merge "$PR" --squash --match-head-commit "$SHA"
        env:
          PR: ${{ github.event.pull_request.html_url }}
          SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
